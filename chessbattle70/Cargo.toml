[package]
name = "chessbattle70"
version = "0.1.0"
edition = "2018"
description = "An implementation of ChessBattle70, a 7x10 chess variant"
keywords = ["mcts", "ai", "game", "search", "tree"]
categories = ["algorithms", "game-development", "games"]

[dependencies]
arbor = { path = "../arbor" }
instant = { version = "0.1", features = [ "wasm-bindgen" ] }
wasm-bindgen = "0.2.78"
getrandom = {version = "0.2", features = ["js"]}
serde_json = "1.0.74"

[[bin]]
name = "chessbattle70"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]
name = "chessbattle70"
path = "src/lib.rs"
